type: dnf
repos:
  copr:
    - atim/starship
    - jerrycasiano/FontManager
group-install:
  packages:
    - virtualization
    # see https://fedoramagazine.org/full-virtualization-system-on-fedora-workstation-30/ and https://github.com/ublue-os/bluefin/blob/7aafce49db08d8d965a827582ce5dc806ac9017e/system_files/dx/usr/bin/bluefin-dx-groups#L4 if we want setup of the group
    # maybe we need to set the group, and enable the service on new installations
install:
  packages:
    - repo: copr:copr.fedorainfracloud.org:atim:starship
      packages:
        - starship

    # install from copr:copr.fedorainfracloud.org:jerrycasiano:FontManager
    # but requires dependencies from other repos
    - font-manager

    # external
    - https://github.com/go-task/task/releases/download/v3.53.1/task_3.53.1_linux_amd64.rpm

    # foundation
    - fish
    - neovim
    - syncthing
    - git
    - git-credential-libsecret
    - curl

    # Printer, see also /etc/cups/cups-pdf.conf and printers.conf
    - cups-pdf

    # system
    - gparted

    # network
    - NetworkManager-openconnect-gnome
    - NetworkManager-openvpn-gnome
    - NetworkManager-ssh-gnome
    - NetworkManager-vpnc-gnome
    - tailscale
    - trayscale

    # gnome setup
    - gnome-browser-connector
    - gnome-remote-desktop
    - gnome-shell-extension-appindicator
    - gnome-shell-extension-blur-my-shell
    - gnome-shell-extension-caffeine
    - gnome-shell-extension-gsconnect
    - gnome-shell-extension-user-theme

    # fonts
    - open-sans-fonts

    # handy tools
    - ack
    - baobab
    - dos2unix
    - fastfetch
    - htop
    - moreutils
    - pwgen
    - restic
    - rsync
    - tmux
    - yt-dlp

    # development
    - android-tools
    - ansible
    - ansible-collection-ansible-posix
    - ansible-collection-community-docker
    - ansible-packaging
    - cargo
    - cmake
    - exiv2
    - gcc-c++
    - ghex
    - gnuplot
    - imapsync
    - java-latest-openjdk
    - jpegoptim
    - maven
    - nodejs-npm
    - openssl
    - optipng
    - pipx
    - podman-docker
    - python3-devel
    - python3-pip
    - python3-virtualenvwrapper
    - rust
    - rustup
    - sqlite
    - sqlitebrowser

    # development: tauri
    - libappindicator-gtk3-devel
    - librsvg2-devel
    - libxdo-devel
    - openssl-devel
    - webkit2gtk4.1-devel

    # desktop
    - calls
    - cheese
    - chromium
    - diffpdf
    - eog
    - eog-plugins
    - file-roller-nautilus
    - gnome-text-editor
    - gpsbabel
    - hunspell-de
    - hunspell-en
    - keepassxc
    - langpacks-de
    - langpacks-en
    - libreoffice
    - ocrmypdf
    - papers
    - pdftk-java
    - qcad
    - tesseract-langpack-deu
    - tesseract-langpack-frk
    - tesseract-osd
    - tesseract-script-fraktur
    - xournal

    # games
    - hedgewars
    - moon-buggy

    # dependency Appimage
    - fuse-libs

    # temporary/staging
    # maybe remove
    # - calibre
    # - entr
