# https://blue-build.org/reference/modules/akmods/
modules:
  - type: script
    snippets:
      - "echo '% pkgverify_level digest' > /etc/rpm/macros.verify"
  - type: akmods
    install:
      # install broadcom-wl from rpmfusion
      # https://github.com/ublue-os/akmods?tab=readme-ov-file
      - wl
  - type: script
    snippets:
      - "rm /etc/rpm/macros.verify"
